[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/platform",
    "crates/app",
    "crates/proctor",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/harryjin/rustbrowser"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
getrandom = "0.2"
hex = "0.4"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSPasteboard", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
tao = "0.34"
thiserror = "2.0"
toml = "0.8"
url = { version = "2.5", features = ["serde"] }
wry = { version = "0.53", features = ["transparent"] }
